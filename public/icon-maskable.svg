<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c2b" />
      <stop offset="100%" stop-color="#0a0c14" />
    </linearGradient>
    <linearGradient id="accentGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background for Adaptive Launcher Crop -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Centered Scaled Content (80% Safe Zone Margin) -->
  <g transform="translate(51.2, 51.2) scale(0.8)" filter="url(#glowMask)">
    <!-- Branch stem and fork paths -->
    <path d="M 160 380 L 160 210 Q 160 140 230 140 L 340 140" fill="none" stroke="url(#accentGradMask)" stroke-width="28" stroke-linecap="round" />
    <path d="M 160 290 Q 230 290 280 340 L 340 340" fill="none" stroke="url(#accentGradMask)" stroke-width="24" stroke-linecap="round" />
    <path d="M 160 380 L 160 410" fill="none" stroke="url(#accentGradMask)" stroke-width="28" stroke-linecap="round" />

    <!-- Network Circuit Nodes -->
    <circle cx="160" cy="380" r="28" fill="#6366f1" />
    <circle cx="160" cy="380" r="14" fill="#ffffff" />

    <circle cx="340" cy="140" r="32" fill="#06b6d4" />
    <circle cx="340" cy="140" r="16" fill="#ffffff" />

    <circle cx="340" cy="340" r="26" fill="#a855f7" />
    <circle cx="340" cy="340" r="13" fill="#ffffff" />

    <circle cx="160" cy="210" r="16" fill="#818cf8" />
  </g>
</svg>
