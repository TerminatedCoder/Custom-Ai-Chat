<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c2b" />
      <stop offset="100%" stop-color="#0a0c14" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.4" />

  <!-- Glowing Branch Nodes & Network Path -->
  <g filter="url(#glow)">
    <!-- Branch stem and fork paths -->
    <path d="M 160 380 L 160 210 Q 160 140 230 140 L 340 140" fill="none" stroke="url(#accentGrad)" stroke-width="28" stroke-linecap="round" />
    <path d="M 160 290 Q 230 290 280 340 L 340 340" fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round" />
    <path d="M 160 380 L 160 410" fill="none" stroke="url(#accentGrad)" stroke-width="28" stroke-linecap="round" />

    <!-- Network Circuit Nodes -->
    <circle cx="160" cy="380" r="28" fill="#6366f1" />
    <circle cx="160" cy="380" r="14" fill="#ffffff" />

    <circle cx="340" cy="140" r="32" fill="#06b6d4" />
    <circle cx="340" cy="140" r="16" fill="#ffffff" />

    <circle cx="340" cy="340" r="26" fill="#a855f7" />
    <circle cx="340" cy="340" r="13" fill="#ffffff" />

    <circle cx="160" cy="210" r="16" fill="#818cf8" />
  </g>
</svg>
