[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/router/scrape-docs"
  to = "/.netlify/functions/router-scrape-docs"
  status = 200

[[redirects]]
  from = "/api/router/models"
  to = "/.netlify/functions/router-models"
  status = 200

[[redirects]]
  from = "/api/router/chat"
  to = "/.netlify/functions/router-chat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
